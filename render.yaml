# Déploiement sur Render (https://render.com) : New → Blueprint → choisir ce dépôt GitHub
# Render demande seulement DATABASE_URL (l'URL de connexion de la base Neon). Le site est en HTTPS :
# installation sur le téléphone et notifications fonctionnent.
services:
  - type: web
    name: elghanja
    runtime: node
    plan: free
    buildCommand: npm install --prefix server --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/sante
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false            # à coller lors de la création (URL Neon)
      - key: JWT_SECRET
        generateValue: true    # clé secrète générée automatiquement par Render
      - key: PUSH_CONTACT
        value: mailto:contact@elghanja.tn
      # Emails des promotions (facultatif) : SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM
